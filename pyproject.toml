[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ableton-arrangement-mcp"
version = "0.1.0"
description = "Local MCP bridge for Ableton Live Arrangement clips"
requires-python = ">=3.10"
dependencies = ["mcp>=1.26,<2"]

[project.scripts]
ableton-arrangement-mcp = "ableton_arrangement_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
